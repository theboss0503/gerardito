name: Pruebas Gerardito API (IA Real)

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio
          
      - name: Descargar modelo base de spaCy
        run: |
          python -m spacy download es_core_news_sm

      - name: Ejecutar pruebas de API con IA Real
        env:
          # Inyectamos los secretos como variables de entorno
          ZGROK_URL: ${{ secrets.ZGROK_URL }}
          ZGROK_TOKEN: ${{ secrets.ZGROK_TOKEN }}
        run: |
          pytest -v test/
