name: Pruebas Gerardito API

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gerardito
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gerardito_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerardito -d gerardito_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Descargar modelo base de spaCy
        run: |
          python -m spacy download es_core_news_sm

      - name: Ejecutar pruebas de API
        env:
          OLLAMA_HOST: https://ollama.com
          MODEL_NAME: gemma4:31b
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          DATABASE_URL: postgresql+asyncpg://gerardito:password@localhost:5432/gerardito_db
        run: |
          python -m pytest -v test/
