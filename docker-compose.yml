services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gerardito
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gerardito_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerardito -d gerardito_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-https://ollama.com}
      - MODEL_NAME=${MODEL_NAME:-gemma4:31b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://gerardito:password@postgres:5432/gerardito_db
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app/FrontEnd:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_PROXY_TARGET=http://api:8000

volumes:
  pgdata: