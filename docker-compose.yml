services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gerardito
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambia_esto}
      POSTGRES_DB: gerardito_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerardito -d gerardito_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-https://ollama.com}
      - MODEL_NAME=${MODEL_NAME:-gemma4:31b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://gerardito:${DB_PASSWORD}@postgres:5432/gerardito_db
      - PORT=8000
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./app/FrontEnd
    expose:
      - "5173"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
